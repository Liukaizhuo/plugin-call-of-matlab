# dsh-matlab-simulink — bundle patch layer.
#
# One loader entry, addressed by package name. The Cordis loader resolves it
# from the profile's node_modules, which is where an npm install (or
# `tools/sync-to-profile.mjs`) puts the package, so this file stays portable:
# it carries no absolute path from the machine that built it.
#
# When the plugin is used straight from a checkout instead of an install, add a
# profile entry pointing at the checkout's entry module, or run
#   node tools/sync-to-profile.mjs
# which installs the copy and writes that entry for you.
- insert:
    - id: dsh-matlab-simulink
      name: "dsh-matlab-simulink"
      config:
        # Leave empty to auto-discover MATLAB_ROOT / PATH / registry / default
        # install roots. Set explicit roots to pin a specific release, e.g.
        #   matlabRoots: ["E:\\Program Files\\MATLAB\\R2024a"]
        matlabRoots: []
        # Per-call default and ceiling for MATLAB wall-clock time.
        timeoutMs: 600000
        maxTimeoutMs: 3600000
        # A MATLAB batch session is heavyweight: serialise by default.
        maxConcurrent: 1
        # Where per-run staging/working directories are created. Empty = OS temp.
        tempDir: ""
        maxArtifactBytes: 26214400
        maxInlineImageBytes: 6291456
        streamOutput: true
        refreshDiscovery: false
