name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# A MATLAB licence is not available on hosted runners, so CI validates the
# plugin contract and the packaging. The MATLAB-dependent scenarios are reported
# as skipped; see CONTRIBUTING.md for how to run the full suite locally.
jobs:
  contract:
    name: Plugin contract and packaging (Node ${{ matrix.node }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22.x', '24.x']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Report toolchain
        run: |
          node --version
          npm --version

      - name: Syntax-check every source file
        shell: bash
        run: |
          set -e
          for file in lib/*.js test/*.mjs tools/*.mjs; do
            node --check "$file"
            echo "OK  $file"
          done

      - name: Offline plugin contract tests
        run: npm run test:offline

      - name: Verify the published tarball contents
        run: npm run pack:check

      - name: Build and smoke-test the tarball
        run: node tools/pack-check.mjs --build

      - name: Upload the built tarball
        uses: actions/upload-artifact@v4
        with:
          name: dsh-matlab-simulink-tgz-node${{ matrix.node }}
          path: dist/*.tgz
          if-no-files-found: error

  matlab:
    name: Full suite with real MATLAB
    runs-on: [self-hosted, windows, matlab]
    # Only runs when a self-hosted runner labelled `matlab` is registered.
    # Without one this job stays queued, so it is opt-in by design.
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Full test suite (requires MATLAB)
        run: npm run test:strict
